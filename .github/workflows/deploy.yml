name: Deploy AWS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: injury-atlas-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      AWS_DEPLOY_SECURITY_GROUP_ID: ${{ vars.AWS_DEPLOY_SECURITY_GROUP_ID }}
    steps:
      - name: Check deployment configuration
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_DEPLOY_USER: ${{ secrets.AWS_DEPLOY_USER }}
          AWS_DEPLOY_KEY: ${{ secrets.AWS_DEPLOY_KEY }}
          AWS_HOST_FINGERPRINT: ${{ secrets.AWS_HOST_FINGERPRINT }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          python3 - <<'PYTHON'
          import os, sys
          required = ('AWS_HOST', 'AWS_DEPLOY_USER', 'AWS_DEPLOY_KEY',
                      'AWS_HOST_FINGERPRINT', 'AWS_DEPLOY_ROLE_ARN',
                      'AWS_DEPLOY_SECURITY_GROUP_ID', 'APP_URL')
          missing = [key for key in required if not os.environ.get(key, '').strip()]
          if missing:
              sys.exit('Missing production settings: ' + ', '.join(missing) +
                       '. Complete deploy/setup-github-aws.py and GitHub environment setup.')
          PYTHON
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm test
      - run: python3 -m unittest discover -s tests -p 'test_deployment.py' -v
      - run: npm run build && npm run build:atlas && node scripts/release.mjs
      - run: tar -czf release.tgz dist .atlas-build server shared package.json package-lock.json deploy
      - name: Obtain temporary AWS deployment credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: injury-atlas-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Allow this runner through SSH
        id: access
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: python3 deploy/runner-access.py open
      - name: Verify ED25519 host, upload and activate release
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_DEPLOY_USER: ${{ secrets.AWS_DEPLOY_USER }}
          AWS_DEPLOY_KEY: ${{ secrets.AWS_DEPLOY_KEY }}
          AWS_HOST_FINGERPRINT: ${{ secrets.AWS_HOST_FINGERPRINT }}
        run: python3 deploy/release-ssh.py
      - name: Verify public release
        env:
          APP_URL: ${{ vars.APP_URL }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test -n "$APP_URL"
          curl --fail --silent --show-error "$APP_URL/api/health" > health.json
          node -e 'const h=require("./health.json");if(!h.ok||!h.atlasReady||!h.productionWorkerReady||h.release!==process.env.RELEASE_SHA)process.exit(1);console.log("Injury Creation Agent configured:",h.injuryAgentConfigured===true)'
      - name: Remove temporary runner SSH access
        if: ${{ always() && steps.aws.outcome == 'success' && steps.access.outcome != 'skipped' }}
        run: python3 deploy/runner-access.py close
