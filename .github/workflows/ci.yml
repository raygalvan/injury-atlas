name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_deployment.py' -v
      - run: npm run build
      - run: npm run build:atlas
      - run: node scripts/release.mjs
      - run: bash -n deploy/activate.sh
      - name: Install focused browser proof tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --package-lock=false playwright@1.55.1
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify injury production and atlas applications
        run: node --import tsx scripts/check-production-browser.mjs
        env:
          BROWSER_TOOLS: ${{ runner.temp }}/browser
      - name: Verify coordinator and settings interface
        run: node --import tsx scripts/check-coordinator-browser.mjs
        env:
          BROWSER_TOOLS: ${{ runner.temp }}/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: injury-production-proof
          path: artifacts/production
          retention-days: 14
